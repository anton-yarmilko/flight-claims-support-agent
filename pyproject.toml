[project]
name = "flight-claims-support-agent"
version = "0.2.0"
description = "First-line claims support agent: deterministic triage and EU261 checks around a small LLM, with a web demo"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Non-ASCII letters are intended (20 languages); long lines are mostly prompt and locale text.
ignore = ["RUF001", "RUF002", "RUF003", "E501"]
